              hashcash_login_bits: Denna parameter definierar antalet bitar som Hashcash-algoritmen kommer att använda för att generera bevis-av-arbete. Det rekommenderas att använda ett värde mellan 16 (lätt) och 30 (extremt svårt) bitar. Standardvärdet för inloggningsformulär är %{bits} bitar.
